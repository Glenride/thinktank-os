services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: thinktank
      POSTGRES_USER: thinktank
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  app:
    build: ./docker
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
      - cache
    env_file:
      - .env

  horizon:
    build: ./docker
    restart: unless-stopped
    command: ["php", "artisan", "horizon"]
    volumes:
      - ./:/var/www/html
    depends_on:
      - app
    env_file:
      - .env

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    user: "0:0"
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN_FILE=/run/secrets/tunnel_token
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - tunnel_token
    depends_on:
      - web

  the-workshop:
    image: python:3.12-slim
    restart: unless-stopped
    user: "1000:1000"
    command: python3 /home/housedv/projects/the-workshop/server.py
    environment:
      - HOME=/home/housedv
    volumes:
      - /home/housedv/projects/the-workshop:/home/housedv/projects/the-workshop

volumes:
  pgdata:
  redisdata:

secrets:
  db_password:
    file: ./docker/db_password.txt
  tunnel_token:
    file: /home/housedv/.cloudflared/token
